<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storytime – Connect your dreams (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap">
<style>
  :root{
    --paper:#FFF8EE; --card:#FFFDF8; --ink:#2B2440; --muted:#5E5672; --soft:#463E5C;
    --line:#2B2440; --line2:#EADFD0;
    --peach:#FFD9C7; --peach-deep:#F7B49C; --mint:#CDEFD8; --mint-deep:#9FD9B2;
    --lav:#E3DBF7; --lav-deep:#C8B9F0; --butter:#FFF0B8; --sky:#D4EAF7; --rose:#FBD3E0;
    --acc:#2B2440; --acc-soft:var(--lav);
    --warm:#7A3E00; --warm-bg:#FFE7C9; --warm-line:#C9822F; --ok:#1E5A35; --ok-bg:var(--mint);
    --shadow:3px 3px 0 var(--ink); --shadow-lg:5px 5px 0 var(--ink);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
    background:#F3E9DC radial-gradient(#E6D6C2 1.2px,transparent 1.3px) 0 0/18px 18px}
  .app{max-width:440px;min-height:100vh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
  .stripes{height:10px;background:linear-gradient(90deg,var(--peach-deep) 0 20%,var(--butter) 20% 40%,var(--mint-deep) 40% 60%,var(--sky) 60% 80%,var(--lav-deep) 80% 100%);border-bottom:2px solid var(--ink)}
  header{display:flex;align-items:center;gap:8px;padding:14px 14px;background:var(--paper);border-bottom:2px solid var(--ink);position:sticky;top:0;z-index:2}
  header h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em;line-height:1}
  header h1 span{font-style:italic;font-weight:600;color:#B5563C}
  header .sub{font-size:12px;color:var(--muted);margin-top:4px}
  header .grow{flex:1;display:flex;flex-direction:column}
  header .btn{min-height:40px;padding:0 11px;font-size:13px}
  header .iconbtn{width:40px;padding:0;display:flex;align-items:center;justify-content:center}
  header .iconbtn[hidden]{display:none}
  .day.skip{background:repeating-linear-gradient(45deg,#fff 0 4px,var(--line2) 4px 8px);color:var(--muted)}
  .sr{position:absolute;left:-9999px}
  .focus{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;gap:12px;padding:16px max(16px,calc((100vw - 760px)/2));}
  .focusbar{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:12px}
  .focus textarea{flex:1;min-height:0;font-size:18px;line-height:1.7;padding:18px 20px;border-radius:18px;box-shadow:var(--shadow-lg);background:#fff repeating-linear-gradient(transparent 0 29px,#F1E6D6 29px 30.6px);background-position:0 20px;background-attachment:local;resize:none}
  .focusfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
  .mname{font-family:"Space Mono",ui-monospace,monospace;font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:4px}
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .mday{aspect-ratio:1;border:1px solid #D9CBB8;border-radius:3px;background:#fff;padding:0;cursor:pointer;min-width:0}
  .mday.dot{box-shadow:inset 0 0 0 3px var(--ink)}
  .mday.now{border:2px solid var(--ink);background:var(--butter)!important}
  .jrow{display:flex;gap:8px;align-items:stretch}
  .jrow .choice{flex:1}
  .star{width:52px;border:2px solid var(--ink);border-radius:16px;background:var(--card);font-size:22px;color:var(--ink)}
  .star[aria-pressed="true"]{background:var(--butter);box-shadow:var(--shadow)}
  main{flex:1;padding:18px 16px;display:flex;flex-direction:column;gap:16px;padding-bottom:104px}
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--butter);border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(6,1fr)}
  nav button{border:none;background:none;min-height:62px;font:inherit;font-size:11.5px;font-weight:500;color:var(--soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  nav button svg{width:22px;height:22px;padding:3px;border-radius:999px;box-sizing:content-box}
  nav button[aria-current="page"]{color:var(--ink);font-weight:700}
  nav button[aria-current="page"] svg{background:var(--peach-deep);border:2px solid var(--ink)}
  .card{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-lg)}
  .card:nth-of-type(4n+1){background:#FFF6EF}
  .card:nth-of-type(4n+2){background:#F6FBF7}
  .card:nth-of-type(4n+3){background:#F8F5FF}
  .card:nth-of-type(4n){background:#FFFCEB}
  .bubble{background:var(--sky);border:2px solid var(--ink);border-radius:20px 20px 20px 6px;padding:13px 15px;font-size:15.5px;line-height:1.5;box-shadow:var(--shadow)}
  .me{align-self:flex-end;max-width:85%;background:var(--rose);color:var(--ink);border:2px solid var(--ink);border-radius:20px 20px 6px 20px;padding:11px 14px;font-size:15px;line-height:1.45;box-shadow:var(--shadow)}
  .label{font-family:"Space Mono",ui-monospace,monospace;font-size:11.5px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
  .hint{font-size:13px;color:var(--muted);line-height:1.45}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  button{font:inherit;cursor:pointer}
  .btn{min-height:44px;padding:0 15px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:14px;font-weight:500;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
  .btn:hover{background:#FFF3E4}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn.primary{background:var(--peach-deep);color:var(--ink);font-weight:700}
  .btn.primary:hover{background:#F4A386}
  .btn.warm{background:var(--butter);color:var(--ink);font-weight:700}
  .btn.block{width:100%;min-height:52px;font-size:16px}
  .pill{min-height:44px;padding:0 15px;border-radius:999px;border:2px solid var(--ink);background:var(--card);font-size:14px;color:var(--ink)}
  .pill[aria-pressed="true"]{background:var(--lav-deep);font-weight:700;box-shadow:var(--shadow)}
  .choice{text-align:left;padding:11px 13px;border-radius:16px;border:2px solid var(--ink);background:var(--card);min-height:52px;font-size:14px;color:var(--ink)}
  .choice[aria-pressed="true"]{background:var(--mint);font-weight:700;box-shadow:var(--shadow)}
  .choice small{display:block;font-weight:400;color:var(--soft);font-size:12.5px;margin-top:2px}
  input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;font-size:15px;padding:11px 12px;border:2px solid var(--ink);border-radius:14px;color:var(--ink);background:#fff;width:100%}
  textarea{min-height:140px;resize:vertical;line-height:1.55;background:#fff repeating-linear-gradient(transparent 0 25px,#F1E6D6 25px 26px);background-attachment:local}
  label.check{display:flex;gap:10px;align-items:center;min-height:44px;font-size:15px}
  label.check input{width:20px;height:20px;flex-shrink:0;accent-color:#B5563C}
  .tag{font-family:"Space Mono",ui-monospace,monospace;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-block;border:1.5px solid var(--ink)}
  .tag.rec{color:var(--ok);background:var(--mint)}
  .tag.read{color:var(--warm);background:var(--warm-bg)}
  .tag.road{color:var(--warm);background:var(--butter)}
  .note{font-size:13.5px;line-height:1.45;color:var(--soft);background:var(--lav);border-radius:14px;padding:10px 12px;border:1.5px dashed #9C8CCB}
  .warmnote{font-size:13.5px;line-height:1.45;color:var(--warm);background:var(--warm-bg);border-radius:14px;padding:10px 12px;border:1.5px dashed var(--warm-line)}
  .twist{background:var(--butter);border:2px dashed var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .twist b{font-family:Fraunces,Georgia,serif;font-size:19px;font-style:italic;color:var(--ink)!important}
  .twist div{color:var(--soft)!important}
  .quote{background:var(--peach);border:2px solid var(--ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
  .quote::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:repeating-radial-gradient(circle,var(--butter) 0 8px,var(--peach-deep) 8px 16px);opacity:.75;border:2px solid var(--ink)}
  .quote q{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:21px;line-height:1.35;quotes:"“" "”";position:relative;z-index:1;padding-right:46px}
  .quote .by{font-size:13px;color:var(--soft);position:relative;z-index:1}
  .quote .row{position:relative;z-index:1}
  .bar{height:12px;background:#fff;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
  .bar>span{display:block;height:100%;background:var(--peach-deep)}
  .src{border:2px solid var(--ink);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:#fff}
  .src .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .map{display:grid;gap:6px;font-size:12px;text-align:center}
  button.day{font:inherit;font-size:12px;color:var(--ink);cursor:pointer;padding:0}
  .day{height:32px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1.5px solid var(--ink);background:#fff}
  .day.done{background:var(--mint-deep);font-weight:700}
  .day.today{border-width:3px;background:var(--butter);font-weight:800}
  .day.rev{border-style:dashed;background:var(--lav)}
  .day.exp{border-style:dashed;background:var(--peach);font-weight:700}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--soft)}
  .legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1.5px solid var(--ink)}
  .menu{display:flex;flex-direction:column;gap:8px}
  .banner{background:var(--ink);color:var(--butter);font-family:"Space Mono",ui-monospace,monospace;font-size:11px;padding:7px 12px;text-align:center;letter-spacing:.03em}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--lav);border:2px solid var(--ink);border-radius:999px;padding:4px}
  .seg button{min-height:42px;border:none;border-radius:999px;background:transparent;color:var(--soft);font-size:14px}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;border:2px solid var(--ink)}
  ul.clean{margin:0;padding-left:18px;line-height:1.6;font-size:14px}
  .strike{text-decoration:line-through;color:var(--muted)}
  .big{font-family:Fraunces,Georgia,serif;font-weight:800}
  .hello{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:800;line-height:1.1;margin:4px 0 0}
  .hello em{font-weight:600;color:#B5563C}
  a{color:#9A3F28;font-weight:500}
  :focus-visible{outline:3px solid #7A63C9;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="banner">PROTOTYPE · rule-based replies · data stays in this browser</div>
  <div class="stripes" aria-hidden="true"></div>
  <header>
    <button class="btn iconbtn" id="backBtn" type="button" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="grow"><h1>Story<span>time</span></h1><span class="sub" id="subtitle">Connect your dreams</span></div>
    <button class="btn" id="whereBtn" type="button">Where was I?</button>
    <button class="btn" id="menuBtn" type="button" aria-label="Open menu">Menu</button>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav aria-label="Main">
    <button type="button" data-go="write"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Write</button>
    <button type="button" data-go="checkin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>Check-in</button>
    <button type="button" data-go="diary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Diary</button>
    <button type="button" data-go="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>Map</button>
    <button type="button" data-go="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg>Goals</button>
    <button type="button" data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Settings</button>
  </nav>
</div>
<script>
(function(){
"use strict";
var KEY = "storytime-prototype-v1";
var JOURNEYS = ["Career and freelance","Relationships and finding a partner","Money and finances","Personal planning and habits","Learning and getting better","Creativity and expression","Dreams and inner life","Legacy and family"];
var QUOTES = [
  ["Nothing, Lucilius, is ours, except time.","Seneca, Moral Letters to Lucilius, Letter 1 (tr. R. M. Gummere, 1917)"],
  ["Simplify, simplify.","Henry David Thoreau, Walden (1854)"],
  ["I went to the woods because I wished to live deliberately.","Henry David Thoreau, Walden (1854)"],
  ["Trust thyself: every heart vibrates to that iron string.","Ralph Waldo Emerson, “Self-Reliance” (1841)"],
  ["I am large, I contain multitudes.","Walt Whitman, “Song of Myself”"],
  ["This above all: to thine own self be true.","William Shakespeare, Hamlet, Act 1, Scene 3"],
  ["“Hope” is the thing with feathers","Emily Dickinson, poem first line"],
  ["To see takes time, like to have a friend takes time.","Georgia O’Keeffe, “About Myself” (1939)"]
];
var FEELINGS = ["happy","glad","proud","relieved","calm","lighter","excited","grateful","hopeful","nervous","anxious","worried","afraid","scared","sad","lonely","angry","frustrated","annoyed","ashamed","embarrassed","tired","exhausted","stuck","overwhelmed","confused","frozen","froze","disappointed","guilty","jealous","curious","inspired"];
var HEAVY = ["died","death","funeral","grief","abuse","abused","assault","violence","illness","diagnosis","miscarriage","divorce","bankrupt","fired","hurt me","afraid of him","afraid of her"];
var RISK = ["kill myself","end my life","suicide","hurt myself","self-harm","self harm","don't want to live","dont want to live","want to die"];
var CRITIC = [/\bi always\b[^.!?]*/i,/\bi never\b[^.!?]*/i,/\bi'?m not good enough\b[^.!?]*/i,/\bi'?m (so )?(stupid|useless|a failure|hopeless)\b[^.!?]*/i,/\bi can'?t do anything\b[^.!?]*/i];
var STOP = ("a an and the to of in on at for with without from by about as is are was were be been being it its this that these those i me my we our you your he she they them their his her not no yes do did done have has had will would can could should just so very really also then than but or if when while into out up down over under again more most some any all each other such only own same too s t don now there here what which who whom why how").split(" ");

var state = load();
var ui = {view:"write", mode:"Listen", draft:"", happened:"", journey:"", vault:false, offRecord:false, savedIdx:null, reflectText:"", reflection:null, twistShown:false, diaryTab:"diary", query:"", includeVault:false, quoteIx:0, jobText:"", ticked:{}, shareSel:{}, menuOpen:false};

function today(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addDays(iso,n){ var d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function blank(){ return {settings:null, programme:null, programmes:[], entries:[], achievements:[], checkins:[], lastActivity:null}; }
function load(){ try{ var raw=localStorage.getItem(KEY); if(raw){ var s=JSON.parse(raw); return Object.assign(blank(),s);} }catch(e){} return blank(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function setActivity(label){ state.lastActivity={date:today(), view:ui.view, label:label}; save(); }
function greeting(){ var h=new Date().getHours(); return (h<5?'Still up?':h<12?'Good <em>morning.</em>':h<18?'Good <em>afternoon.</em>':'Good <em>evening.</em>'); }
function toneLead(){ var t=state.settings?state.settings.tone:"Gentle"; return {Gentle:"Thank you for writing this down. ",Practical:"",Playful:"Okay, story time. ",Direct:""}[t]||""; }
function has(text,list){ var l=text.toLowerCase(); for(var i=0;i<list.length;i++){ if(l.indexOf(list[i])>=0) return list[i]; } return null; }
function sentences(t){ return (t.match(/[^.!?\n]+[.!?]?/g)||[]).map(function(s){return s.trim();}).filter(Boolean); }
function words(t){ return (t.toLowerCase().match(/[a-zåäöéü']+/g)||[]).filter(function(w){return w.length>2 && STOP.indexOf(w)<0;}); }

/* ---------- routing ---------- */
var view = document.getElementById("view");
document.querySelectorAll("nav button").forEach(function(b){ b.addEventListener("click",function(){ if(b.getAttribute("data-go")==="map") ui.mapProg=null; go(b.getAttribute("data-go")); }); });
var VIEWS=["alltime","write","checkin","diary","map","goals","career","settings","programme","share","where","menu","notes","entry","day"];
var depth=0;
document.getElementById("menuBtn").addEventListener("click",function(){ go(ui.view==="menu"?"write":"menu"); });
document.getElementById("whereBtn").addEventListener("click",function(){ go("where"); });
document.getElementById("backBtn").addEventListener("click",back);
function go(v){ if(v===ui.view && v!=="entry" && v!=="day"){ render(); return; } depth++; try{ history.pushState({v:v,d:depth},"","#"+v); }catch(e){} show(v); }
function back(){ if(depth>0){ try{ history.back(); return; }catch(e){} } show(state.programme?"checkin":"write"); }
function show(v){ if(v!=="programme"&&ui.view==="programme") ui.progNew=false; if(ui.focusMode){ readDraft(); ui.focusMode=false; } if(v==="programme"&&ui.view!=="programme"&&!ui.progNew) ui.prog=null; ui.view=VIEWS.indexOf(v)>=0?v:"write"; ui.menuOpen=false; render(); view.focus(); window.scrollTo(0,0); }
window.addEventListener("popstate",function(ev){ depth=ev.state&&ev.state.d?ev.state.d:0; var v=(location.hash||"").slice(1); show(v||(state.programme?"checkin":"write")); });
try{ history.replaceState({v:"start",d:0},"",location.pathname+location.search); }catch(e){}

function render(){
  document.querySelectorAll("nav button").forEach(function(b){ if(b.getAttribute("data-go")===ui.view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  var p=state.programme;
  document.getElementById("subtitle").textContent = p ? ("Day "+dayNo()+(p.days?" of "+p.days:"")+" · "+p.focus) : "Connect your dreams";
  document.getElementById("backBtn").hidden = !state.settings || (depth===0);
  if(!state.settings){ view.innerHTML=onboarding(); bind(); return; }
  if(ui.view==="menu"){ view.innerHTML=menu(); bind(); return; }
  var f={write:writeView,checkin:checkinView,diary:diaryView,map:mapView,career:careerView,goals:goalsView,settings:settingsView,programme:programmeView,alltime:allTimeView,notes:notesView,entry:entryView,day:dayView,share:shareView,where:whereView}[ui.view]||writeView;
  view.innerHTML=f(); bind();
}
function dayNo(){ var p=state.programme; if(!p) return 0; return Math.max(1,daysBetween(p.start,today())+1); }

/* ---------- views ---------- */
function onboarding(){
  return '<p class="hello">Hello, <em>storyteller.</em></p><div class="bubble">Welcome to Storytime – a private place to think, dream and take small brave steps. Three quick choices; you can change them any time.</div>'+
  '<div class="card"><label class="label" for="folder">Journal folder on your NAS</label><input id="folder" type="text" value="Storytime" aria-describedby="fh"><span id="fh" class="hint">In this prototype, entries are kept in your browser instead.</span></div>'+
  toneCard("Gentle","Offer them")+

/* ---------- reflection logic ---------- */
function buildReflection(text){
  var s=state.settings, sts=sentences(text), h='';
  var risk=has(text,RISK);
  if(risk){
    return '<div class="card" role="alert"><b>I’m really glad you wrote this down.</b><div style="font-size:14px;line-height:1.5">It sounds like you may be in a lot of pain. Please reach out now to someone you trust, a crisis line or local emergency services. You don’t have to handle this alone.</div><div class="hint">I’ve paused reflection and plot twists. Nothing has been saved unless you choose to save it.</div></div>';
  }
  var heavy=has(text,HEAVY);
  var feel=FEELINGS.filter(function(f){return text.toLowerCase().indexOf(f)>=0;});
  if(ui.mode==="Listen"){
    h+='<div class="bubble">'+esc(toneLead())+'Here’s what I heard, in three parts. Change anything that’s off.</div><div class="card">'+
       '<span class="label">What happened</span><div style="font-size:14px">'+esc(sts.slice(0,2).join(" ")||text)+'</div>'+
       '<span class="label">What you felt</span><div style="font-size:14px">'+(feel.length?'You used: '+feel.map(function(f){return '“'+esc(f)+'”';}).join(", ")+'.':'You didn’t name a feeling. Want to add one?')+'</div>'+
       '<span class="label">What you think it means</span><div style="font-size:14px">In your words: “'+esc(sts[sts.length-1]||text)+'”</div></div>';
  } else if(ui.mode==="Explore"){
    h+='<div class="bubble">'+esc(toneLead())+'Three questions, answer any or none:</div><div class="card"><ul class="clean">'+
       '<li>What would you like to be true about this a month from now?</li><li>If a friend wrote this, what would you tell them?</li><li>What is one thing here you can influence, and one you can’t?</li></ul>'+
       (state.programme?'<div class="note">Link to your goal: “'+esc(state.programme.goal)+'”. Does this entry move you towards it, away from it, or neither?</div>':'')+'</div>';
  } else {
    h+='<div class="bubble">'+esc(toneLead())+'Let’s turn one insight into a small experiment.</div><div class="card"><label class="label" for="expAction">Experiment</label><input id="expAction" type="text" placeholder="e.g. Tell one interview story out loud">'+
       '<div class="grid2"><div><label class="hint" for="expCount">How many times</label><input id="expCount" type="number" min="1" max="21" value="3"></div><div><label class="hint" for="expReview">Review on</label><input id="expReview" type="date" value="'+addDays(today(),7)+'"></div></div><button type="button" class="btn primary" data-act="setExp">Set this experiment</button></div>';
  }
  for(var i=0;i<CRITIC.length;i++){ var m=text.match(CRITIC[i]); if(m){
    h+='<div class="card"><span class="label">Inner critic, said more fairly</span><div class="strike" style="font-size:14px">“'+esc(m[0].trim())+'”</div><div style="font-size:14px">Try: “This time I ____. I also have evidence that ____.”</div><div class="note">One manageable step: write one sentence of evidence against the harsh version.</div></div>'; break; } }
  if(s.twists==="Offer them" && !heavy && !ui.twistShown){
    h+='<div class="twist"><b>Want a plot twist?</b><div style="font-size:14px">Only if it feels right. I can retell this from another angle – a possibility, not the truth.</div><div class="row"><button type="button" class="btn warm" data-act="twistYes">Yes, show me</button><button type="button" class="btn" data-act="twistNo">Not today</button></div></div>';
  }
  if(heavy) h+='<div class="note">This sounds heavy. I’ll stay with listening – no plot twists unless you ask.</div>';
  h+='<div class="grid2">'+(ui.savedIdx!==null?'<button type="button" class="btn primary" data-act="addReflection">Add reflection to entry</button>':(ui.lastOff?'<button type="button" class="btn primary" data-act="saveAfterAll">Save it after all</button>':''))+(hasJ("Career and freelance")?'<button type="button" class="btn" data-act="addFromEntry">Add to achievement bank</button>':'')+'</div>';
  return h;
}
var PROMPTS=["What took more energy than it should have today?","Describe one small moment you want to remember.","What would you try if you knew it couldn’t fail?","Write a letter to yourself one year from now.","What are you avoiding, and what is the smallest first step?","Describe a dream from last night – just the images first."];

function readDraft(){ var big=document.getElementById("draftBig"); if(big){ ui.draft=big.value; return; } var d=document.getElementById("draft"); if(d){ ui.draft=d.value; ui.happened=document.getElementById("happened").value; ui.journey=document.getElementById("journey").value; ui.offRecord=document.getElementById("offRecord").checked; ui.vault=!ui.offRecord&&document.getElementById("vault").checked; } }
function storeEntry(t){

}

  var big=document.getElementById("draftBig"); if(big){ big.addEventListener("input",function(){ var n=(big.value.trim().match(/\S+/g)||[]).length; document.getElementById("wc").textContent=n+" word"+(n===1?"":"s"); }); big.addEventListener("keydown",function(e){ if(e.key==="Escape"){ e.preventDefault(); act("collapse"); } }); }

function keepStart(){ var ps=document.getElementById("pstart"); if(ps&&ui.prog) ui.prog.start=ps.value||today(); }
function keepGoal(){ keepStart(); var g=document.getElementById("goal"); if(g&&ui.prog) ui.prog.goal=g.value; var c=document.getElementById("customDays"); if(c&&+c.value>0&&ui.prog) ui.prog.days=+c.value; }
function pressed(group){ var g=view.querySelector('[data-group="'+group+'"]'); if(!g) return []; return Array.prototype.map.call(g.querySelectorAll('[aria-pressed="true"]'),function(b){return b.getAttribute("data-val");}); }

function act(a){
  var p=state.programme;
  switch(a){
    case "finishOnboarding":
      state.settings={folder:document.getElementById("folder").value.trim()||"Storytime",tone:pressed("tone")[0]||"Gentle",twists:pressed("twists")[0]||"Offer them",rhythm:pressed("rhythm")[0]||"3× a week"};
      setActivity("Settings – first start"); save(); go("programme"); break;
    case "sample": loadSample(); go("checkin"); break;
    case "openMenu": go("menu"); break;
    case "back": back(); break;
    case "askFinish": ui.confirmFinish=true; render(); break;
    case "cancelFinish": ui.confirmFinish=false; render(); break;
    case "finishProgramme": if(p){ p.end=today(); p.status="finished"; state.programmes.push(p); state.programme=null; ui.confirmFinish=false; setActivity("All time – finished a programme"); save(); go("alltime"); } break;
    case "newProgramme": ui.prog=null; ui.progNew=true; ui.confirmFinish=false; ui.view="__"; go("programme"); break;
    case "toAllTime": go("alltime"); break;
    case "clearRange": ui.notesFrom=ui.notesTo=null; render(); break;
    case "expand": readDraft(); ui.focusMode=true; render(); var tb=document.getElementById("draftBig"); if(tb){ tb.focus(); tb.setSelectionRange(tb.value.length,tb.value.length); } break;
    case "collapse": readDraft(); ui.focusMode=false; render(); var eb=document.getElementById("expandBtn"); if(eb) eb.focus(); break;
    case "promptBig": readDraft(); ui.draft=(ui.draft?ui.draft+"\n\n":"")+PROMPTS[Math.floor(Math.random()*PROMPTS.length)]+"\n"; render(); var tb2=document.getElementById("draftBig"); if(tb2){ tb2.focus(); tb2.setSelectionRange(tb2.value.length,tb2.value.length); } break;
    case "notesFilter": ui.notesQ=document.getElementById("nq").value.trim(); ui.notesJ=document.getElementById("nj").value; ui.showVault=document.getElementById("nv").checked; render(); break;
    case "followUp": var fe=state.entries[ui.entryIdx]; if(fe){ ui.draft="Follow-up to “"+fe.title+"” ("+fe.written+"):\n\n"; ui.journey=fe.journey||""; ui.reflection=null; go("write"); } break;
    case "askAbout": var ae=state.entries[ui.entryIdx]; if(ae){ ui.diaryTab="diary"; ui.query=(words(ae.title)[0]||ae.title); ui.includeVault=ae.vault; setActivity("Diary – “"+ui.query+"”"); go("diary"); } break;
    case "entryToBank": var be=state.entries[ui.entryIdx]; if(be){ go("career"); var at=document.getElementById("achTitle"); if(at) at.value=(sentences(be.text)[0]||be.title).slice(0,80); var as=document.getElementById("achSource"); if(as) as.value=be.written+" – "+be.title; } break;
    case "writeForDay": ui.happened=ui.dayDate; ui.reflection=null; go("write"); break;
    case "skipProgramme": if(state.programme) back(); else go("write"); break;
    case "prompt": readDraft(); ui.draft=(ui.draft?ui.draft+"\n\n":"")+PROMPTS[Math.floor(Math.random()*PROMPTS.length)]+"\n"; render(); break;
    case "reflect": readDraft(); if(!ui.draft.trim()){ alertMsg("Write something first – or pick a starter prompt."); return; }
      ui.reflectText=ui.draft.trim(); ui.savedIdx=null; ui.twistShown=false; ui.lastOff=false;
      if(!ui.offRecord && !has(ui.reflectText,RISK)) storeEntry(ui.reflectText);
      ui.lastOff=ui.offRecord; ui.offRecord=false; ui.vault=false; ui.draft=""; ui.reflection=savedLine()+buildReflection(ui.reflectText); setActivity("Write – "+ui.mode); render(); break;
    case "undoSave": if(ui.savedIdx!==null){ state.entries.splice(ui.savedIdx,1); ui.savedIdx=null; ui.lastOff=true; save(); ui.reflection=savedLine()+buildReflection(ui.reflectText); render(); } break;
    case "saveAfterAll": ui.lastOff=false; if(ui.reflectText){ storeEntry(ui.reflectText); ui.reflection=savedLine()+buildReflection(ui.reflectText); } render(); break;
    case "addReflection": if(ui.savedIdx!==null&&state.entries[ui.savedIdx]){ state.entries[ui.savedIdx].reflection=ui.mode; save(); ui.reflection=savedLine()+'<div class="note" role="status">Reflection added to the entry.</div>'+buildReflection(ui.reflectText); render(); } break;
    case "justSave": saveEntry(); break;
    case "noAnalyse": saveEntry(); break;
    case "stop": readDraft(); ui.reflection='<div class="note" role="status">Stopped. '+(ui.draft.trim()?'Your text is still in the box and has not been saved.':'Nothing more will happen.')+'</div>'; render(); break;
    case "twistYes": ui.twistShown=true; ui.reflection=savedLine()+buildReflection(ui.reflectText)+'<div class="twist"><b>Plot twist (a possibility, not the truth)</b><div style="font-size:14px">Imagine this as chapter 3 of a longer story. What does the main character learn here that they will need in chapter 7?</div></div>'; render(); break;
    case "twistNo": ui.twistShown=true; ui.reflection=savedLine()+buildReflection(ui.reflectText); render(); break;
    case "setExp":
      if(!p){ alertMsg("Start a programme first – experiments live in it."); return; }
      var act2=document.getElementById("expAction").value.trim(); if(!act2){ return; }
      p.experiment={action:act2,count:Math.max(1,+document.getElementById("expCount").value||3),done:0,review:document.getElementById("expReview").value||addDays(today(),7)};
      setActivity("Act – new experiment"); save(); ui.reflection=savedLine()+'<div class="card" role="status"><b>Experiment set.</b><div class="hint">Review on '+esc(p.experiment.review)+'. You’ll see it in your check-in.</div></div>'; render(); break;
    case "addFromEntry": var t=(sentences(ui.reflectText)[0]||"").slice(0,80); go("career"); var f=document.getElementById("achTitle"); if(f) f.value=t; break;
    case "nextQuote": ui.quoteIx++; render(); break;
    case "writeQuote": var q=QUOTES[ui.quoteIx%QUOTES.length]; ui.draft="“"+q[0]+"” – "+q[1]+"\n\n"; ui.mode="Explore"; go("write"); break;
    case "expDone": if(p&&p.experiment){ p.experiment.done=Math.min(p.experiment.count,p.experiment.done+1); state.checkins=state.checkins.filter(function(c){return c.date!==today();}).concat([{date:today(),mood:"Okay"}]); setActivity("Check-in – experiment"); save(); render(); } break;
    case "expClear": if(p){ p.experiment=null; save(); render(); } break;
    case "pause": if(p){ p.paused=!p.paused; save(); render(); } break;
    case "skip": state.checkins=state.checkins.filter(function(c){return c.date!==today();}).concat([{date:today(),mood:"Skip"}]); save(); render(); break;
    case "lighter": if(p){ p.lighter=!p.lighter; save(); render(); } break;
    case "ask": ui.query=document.getElementById("q").value.trim(); ui.includeVault=document.getElementById("incVault").checked; setActivity("Diary – “"+ui.query+"”"); render(); break;
    case "saveProgramme":
      keepGoal(); var d=ui.prog, msg=document.getElementById("progMsg");
      if(!d.journeys.length){ msg.innerHTML='<div class="warmnote">Pick at least one journey.</div>'; return; }
      if(!d.goal.trim()){ msg.innerHTML='<div class="warmnote">Please write your goal in your own words.</div>'; document.getElementById("goal").focus(); return; }
      if(ui.progNew||!p){ if(p){ p.end=today(); p.status="finished"; state.programmes.push(p); } state.programme={start:d.start||today(),experiment:null,journeys:d.journeys.slice(),focus:d.focus||d.journeys[0],goal:d.goal.trim(),days:d.days,objectives:{}}; }
      else state.programme=Object.assign(p,{journeys:d.journeys.slice(),focus:d.focus||d.journeys[0],goal:d.goal.trim(),days:d.days});
      ui.prog=null; ui.progNew=false; ui.mapProg=null; setActivity("Programme – "+state.programme.focus); save(); go("checkin"); break;
    case "addAch":
      var ti=document.getElementById("achTitle").value.trim(); if(!ti) return;
      state.achievements.push({title:ti,source:document.getElementById("achSource").value,result:document.getElementById("achResult").value.trim()});
      setActivity("Career – achievement bank"); save(); render(); break;
    case "match": ui.jobText=document.getElementById("job").value; setActivity("Career – application kit"); render(); break;
    case "downloadCV":
      var sel=state.achievements.filter(function(x,i){return ui.ticked[i];});
      download("cv-draft.md","# CV draft\n\n"+sel.map(function(x){return "- "+x.title+", delivering "+(x.result||"[THE RESULT]")+"."+(x.source?" (source: "+x.source+")":"");}).join("\n")+"\n"); break;
    case "exportShare":
      var ch=Object.keys(ui.shareSel).filter(function(k){return ui.shareSel[k];}).map(function(k){return state.entries[+k];}).filter(function(e){return e&&!e.vault;});
      download("storytime-shared.md",ch.map(entryMd).join("\n---\n\n")); setActivity("Share – exported"); break;
    case "exportAll": download("storytime-export.json",JSON.stringify(state,null,2),"application/json"); break;
    case "reset": if(window.confirm("Delete all Storytime data in this browser?")){ state=blank(); save(); ui.view="write"; render(); } break;
  }
}
function loadSample(){
